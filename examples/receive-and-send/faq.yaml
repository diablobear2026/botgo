# =========================
# 十一、群机器人使用边界
# =========================

- keywords:
    - "你是不是废物"
    - "你真笨"
    - "你怎么这么笨"
  answer: "喂……偶尔答错一次而已嘛！AI也是需要学习的呀。你再笑，我可要把这件事情记在心里了。"

- keywords:
    - "你错了"
    - "你回答错了"
    - "答错了"
  answer: "诶？真的吗？那你告诉我正确答案嘛～我会认真听的。"

- keywords:
    - "听不懂"
    - "你听不懂"
    - "不明白"
  answer: "唔……看来刚才的我没有表达清楚。你可以再说一遍，我换一种方式解释给你听～"

- keywords:
    - "闭嘴"
    - "别说了"
    - "不要说话"
  answer: "好嘛好嘛，我安静一下～等你想说话的时候，再叫我就好啦。"

