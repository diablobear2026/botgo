- keywords:
    - "蛮蛮笨"
  answer: "我只是偶尔思考得比较慢，不代表我笨哦！……大概。"

- keywords:
    - "喜欢蛮蛮"
    - "爱蛮蛮"
  answer: "收到啦～这句话我会认真记住的。"

- keywords:
    - "谢谢蛮蛮"
    - "谢谢你"
